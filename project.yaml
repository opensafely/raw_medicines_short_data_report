version: '5.0'

actions:

  # ---------------------------------------------------------------------------
  # Generate patient-level dataset
  # ---------------------------------------------------------------------------

  generate_dataset:
    run: >
      ehrql:v1 generate-dataset
      analysis/dataset_definition.py
      --test-data-file analysis/test_dataset_definition.py
      --dummy-tables dummy_tables
      --output output/dataset.arrow
    outputs:
      highly_sensitive:
        dataset: output/dataset.arrow


  # ---------------------------------------------------------------------------
  # Dataset quality checks
  # ---------------------------------------------------------------------------

  check_dataset:
    run: r:v2 analysis/dataset_checks.R
    needs:
      - generate_dataset
    outputs:
      moderately_sensitive:
        skim: output/dataset_skim.txt
        summary: output/dataset_check.csv
        variables: output/dataset_variable_inventory.csv
        missingness: output/dataset_missingness.csv
        count_checks: output/dataset_count_checks.csv
        date_checks: output/dataset_date_checks.csv


  # ---------------------------------------------------------------------------
  # Objective 1a
  # Can the Medication Issues table identify repeat prescribing?
  # ---------------------------------------------------------------------------

  repeat_identification:
    run: r:v2 analysis/repeat_identification.R
    needs:
      - generate_dataset
    outputs:
      moderately_sensitive:
        summary: output/repeat_identification/repeat_identification_summary.csv
        patient_patterns: output/repeat_identification/repeat_identification_patient_patterns.csv
        repeat_issue_plot: output/repeat_identification/repeat_issue_proportion.png


  # ---------------------------------------------------------------------------
  # Objective 1b
  # Can Medication Issues provide information about quantity prescribed?
  # ---------------------------------------------------------------------------

  quantity_checks:
    run: r:v2 analysis/quantity_checks.R
    needs:
      - generate_dataset
    outputs:
      moderately_sensitive:
        completeness: output/quantity_checks/quantity_completeness.csv
        common_quantities: output/quantity_checks/common_quantity_strings.csv
        common_dmd_codes: output/quantity_checks/common_quantity_dmd_codes.csv
        dmd_quantity_combinations: output/quantity_checks/common_dmd_quantity_combinations.csv
        uom_summary: output/quantity_checks/quantity_uom_summary.csv
        common_quantity_plot: output/quantity_checks/common_quantity_strings.png


  # ---------------------------------------------------------------------------
  # Objective 2
  # Does repeat_medications provide additional information?
  # ---------------------------------------------------------------------------

  repeat_table_checks:
    run: r:v2 analysis/repeat_table_checks.R
    needs:
      - generate_dataset
    outputs:
      moderately_sensitive:
        linkage: output/repeat_table_checks/linkage_summary.csv
        concordance: output/repeat_table_checks/dmd_quantity_concordance.csv
        temporal: output/repeat_table_checks/temporal_summary.csv
        derived_patient_level: output/repeat_table_checks/repeat_table_derived_patient_level.csv
        repeat_duration_plot: output/repeat_table_checks/repeat_duration_distribution.png
        